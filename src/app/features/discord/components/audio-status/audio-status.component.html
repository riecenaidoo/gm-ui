@let audio = serverAudio();
@let connecting = isConnecting();
@if (audio) {
  <span [class.loading]="connecting"><strong>Audio Connected</strong></span>
  <span [class.loading]="connecting">{{ audio.channel.name }}</span>
  <app-loading-spinner [loading]="isConnecting()">
    <button (click)="disconnect()">Disconnect</button>
  </app-loading-spinner>
}
