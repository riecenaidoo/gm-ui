<app-loading-spinner [loading]="loading()">
  <img
    [ngSrc]="bot()?.icon_url ?? 'assets/gm-logo.svg'"
    alt="Icon"
    height="48"
    width="48"
  />
</app-loading-spinner>
<span [class.loading]="loading()"
  ><strong>{{ bot()?.name ?? "Gamemaster" }}</strong></span
>
<span [class.loading]="loading()">{{
  bot()?.online ? "Online" : "Offline"
}}</span>
